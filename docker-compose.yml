services:
  ai-or-not:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-or-not
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3104:3000"
    volumes:
      - unsplash-cache:/app/data
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  unsplash-cache:
